---
name: Publish Docker Studio
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/login-action@v4
        with:
          username: cliffano
          password: ${{ secrets.STUDIO_DOCKERHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: cliffano/studio:4.0.0
          shell: bash
          extra_args: '-v ~/.docker/config.json:/root/.docker/config.json:ro'
          command: >
            make deps clean stage lint build-docker-studio arch=${{ matrix.arch
            }} &&

            cat logs/packer-docker-studio.log &&

            docker --version &&

            docker info  &&

            docker inspect cliffano/studio &&

            make publish-docker-studio arch=${{ matrix.arch }}
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: cliffano
          password: ${{ secrets.STUDIO_DOCKERHUB_TOKEN }}
      - run: make publish-docker-studio-manifest

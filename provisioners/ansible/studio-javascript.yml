---
- name: Provision JavaScript tools and libraries
  hosts: localhost

  vars:
    # Available versions: https://github.com/andrewrothstein/ansible-node/blob/main/defaults/main.yml
    node_ver: 24.14.0
    # Node.js architecture names keyed by Ansible architecture
    node_archs:
      x86_64: x64
      aarch64: arm64

  roles:
    - andrewrothstein.node

  tasks:

    - name: Install global npm packages
      community.general.npm:
        name: "{{ item.name }}"
        version: "{{ item.version }}"
        global: true
      loop:
        - { "name": "bob", "version": "5.3.0" }

    - name: Create symbolic link for easy access to node binaries on environments which override the PATH
      ansible.builtin.file:
        src: "/usr/local/node-v{{ node_ver }}-linux-{{ node_archs[ansible_architecture] }}"
        dest: /usr/local/node
        state: link
